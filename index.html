<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meine Karte</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #222;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- Leaflet JavaScript -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

    // Größe unserer Karte
    const mapWidth = 10000;
    const mapHeight = 10000;

    // Leaflet-Koordinatensystem für ein Bild
    const bounds = [
        [0, 0],
        [mapHeight, mapWidth]
    ];

    // Karte erzeugen
    const map = L.map('map', {
        crs: L.CRS.Simple,

        minZoom: -5,
        maxZoom: 5,

        zoomControl: true,

        maxBounds: bounds,
        maxBoundsViscosity: 1.0
    });

    // TESTBILD
    // Das ersetzen wir später durch unsere Tiles.
    const image = L.imageOverlay(
        'https://upload.wikimedia.org/wikipedia/commons/3/3f/Fronalpstock_big.jpg',
        bounds
    );

    image.addTo(map);

    // Karte automatisch passend anzeigen
    map.fitBounds(bounds);

</script>

</body>
</html>
